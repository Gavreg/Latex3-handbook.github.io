<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f172a">
<title>Справочник expl3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3E%5C3%3C/text%3E%3C/svg%3E">
<!-- шрифты с кириллицей; без интернета используются системные (Segoe UI, Cascadia Code) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<button class="skip" id="skipBtn" type="button">Перейти к содержимому</button>
<header class="top">
  <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Оглавление" aria-controls="side" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="#/"><span class="logo" aria-hidden="true">\3</span><span>Справочник expl3</span></a>
  <nav class="top-links" aria-label="Разделы">
    <a href="#/" data-nav="home">Основы</a>
    <a href="#/modules" data-nav="modules">Модули</a>
    <a href="#/tex" data-nav="tex">Справка TeX</a>
    <a href="#/index" data-nav="index">Указатель</a>
  </nav>
  <div class="top-tools">
    <button class="icon-btn search-btn" id="searchBtn" type="button" aria-label="Поиск">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Тёмная тема" aria-pressed="false">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<div class="layout">
  <aside class="side" id="side" aria-label="Оглавление и поиск">
    <div class="search" role="search">
      <label class="vh" for="q">Поиск по справочнику</label>
      <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Поиск: tl_set, пробел…" autocomplete="off" spellcheck="false" aria-controls="results" aria-describedby="qHint">
      <kbd class="kbd" aria-hidden="true">/</kbd>
      <span id="qHint" class="vh">Стрелки вверх и вниз выбирают результат, Enter открывает, Escape очищает.</span>
    </div>
    <div id="qStatus" class="vh" role="status" aria-live="polite"></div>
    <div id="results" class="results" hidden></div>
    <nav id="toc" class="toc" aria-label="Содержание справочника"></nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<script src="data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
